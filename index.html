<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matematikträning</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Modern Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- Tailwind Config -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    
    <!-- MathJax -->
    <script>
        MathJax = {
          tex: {
            inlineMath: [['\\(', '\\)']],
          }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>

    <style>
        .math-question {
            font-size: 1.25rem;
            line-height: 1.8;
        }
        mjx-container[jax="CHTML"] {
            color: inherit !important;
        }
        .math-question img {
            max-width: 100%;
            height: auto;
            border-radius: 0.5rem;
            margin-top: 1rem;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .math-question iframe {
            width: 100%;
            height: 500px;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 0.5rem;
            margin-top: 1rem;
        }

        .math-table {
            width: auto;
            margin-top: 1.5rem;
            margin-bottom: 0.5rem;
            border-collapse: collapse;
            font-size: 1.1rem;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 0.5rem;
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
        }
        .math-table th, .math-table td {
            padding: 0.75rem 1.5rem;
            text-align: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .math-table thead {
            background-color: rgba(139, 92, 246, 0.2);
        }
        .math-table th {
            font-weight: 600;
            color: #c4b5fd;
        }
        .math-table tr:last-child td {
            border-bottom: none;
        }
        .math-table tbody tr:nth-child(even) {
            background-color: rgba(255,255,255,0.03);
        }
        .math-table td {
            color: #e2e8f0;
        }

        @keyframes pulse-glow {
            0%, 100% { opacity: 0.4; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(1.05); }
        }
        .glow-orb {
            animation: pulse-glow 8s infinite ease-in-out;
        }
    </style>
</head>
<body class="bg-slate-950 py-10 px-4 font-sans text-slate-200 relative overflow-x-hidden">

    <!-- Bakgrundseffekter (Glow Orbs) -->
    <div class="fixed top-[-10%] left-[-10%] w-[40rem] h-[40rem] bg-indigo-600/30 rounded-full blur-[120px] glow-orb z-0"></div>
    <div class="fixed bottom-[-10%] right-[-10%] w-[40rem] h-[40rem] bg-pink-600/20 rounded-full blur-[120px] glow-orb z-0" style="animation-delay: 4s;"></div>

    <div id="app" class="w-full max-w-xl mx-auto relative z-10">
        <!-- Header -->
        <div class="text-center mb-8">
            <h1 class="text-5xl md:text-6xl font-extrabold tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-indigo-300 via-purple-300 to-pink-300 drop-shadow-md">Klara Matten!</h1>
            <p id="header-subtitle" class="text-slate-400 mt-4 text-lg font-medium">Välj område och nivå för att börja öva</p>
        </div>

        <!-- Flikar (Tabs) för att välja läge -->
        <div id="mode-tabs" class="flex justify-center gap-2 mb-10 bg-slate-900/50 p-1.5 rounded-xl border border-slate-700/50 backdrop-blur-sm w-fit mx-auto">
            <button id="tab-tasks" onclick="switchMode('tasks')" class="px-6 py-2 rounded-lg font-semibold transition-all duration-300 bg-gradient-to-r from-indigo-600 to-violet-600 text-white shadow-lg">
                Lösa uppgifter
            </button>
            <button id="tab-lessons" onclick="switchMode('lessons')" class="px-6 py-2 rounded-lg font-semibold transition-all duration-300 text-slate-400 hover:text-white">
                Titta på genomgångar
            </button>
        </div>

        <!-- Vy: Välj Kurs -->
        <div id="view-courses" class="view"></div>

        <!-- Vy: Välj Område -->
        <div id="view-areas" class="view hidden"></div>

        <!-- Vy: Välj Delområde -->
        <div id="view-subareas" class="view hidden"></div>

        <!-- Vy: Välj Svårighetsgrad / Videomeny -->
        <div id="view-difficulty" class="view hidden"></div>

        <!-- Vy: Uppgift -->
        <div id="view-task" class="view hidden"></div>
    </div>

    <!-- Gemensam modal för videospelaren -->
    <div id="lesson-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-md p-4">
        <div class="bg-slate-900 rounded-xl border border-slate-700 p-4 max-w-3xl w-full shadow-2xl relative">
            <button onclick="closeVideoModal()" class="absolute -top-4 -right-4 bg-slate-800 border border-slate-600 rounded-full w-10 h-10 flex items-center justify-center text-slate-300 hover:bg-red-500 hover:text-white hover:border-red-500 transition-colors duration-200 shadow-lg z-10">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
            <p id="modal-title" class="text-slate-400 text-sm font-bold tracking-wider mb-3">GENOMGÅNG</p>
            <div class="w-full aspect-video bg-black rounded-lg overflow-hidden border border-slate-700">
                <div id="modal-video-container" class="w-full h-full"></div>
            </div>
        </div>
    </div>

    <!-- Länk till din externa uppgiftsbank -->
    <script src="tasks.js"></script>
    <script src="lesson-bank.js"></script>

    <!-- Huvudlogik -->
    <script>
        if (typeof taskBank === 'undefined' || !Array.isArray(taskBank) || taskBank.length === 0) {
            document.getElementById('view-courses').innerHTML = `
                <div class="bg-red-900/30 border border-red-500/50 text-red-300 px-6 py-4 rounded-xl relative text-center backdrop-blur-sm" role="alert">
                    <strong class="font-bold">Fel: Hittar ingen uppgiftsbank!</strong><br>
                    <span class="block sm:inline mt-2 text-sm">Säkerställ att filen <u>tasks.js</u> ligger i samma mapp som index.html.</span>
                </div>
            `;
        } else {
            initializeApp();
        }

        function initializeApp() {
            let state = {
                mode: 'tasks',
                currentCourse: null,
                currentArea: null,
                currentSubArea: null,
                currentDifficulty: null,
                tasks: [],
                taskTypes: [], 
                examplesMap: {}, 
                currentTaskIndex: 0,
                activeLesson: null,
                lessonVideos: [],
                lessonTasks: []
            };

            function getCurrentBank() {
                if (state.mode === 'lessons') {
                    return taskBank.filter(g => g.lessonVideo);
                }
                return taskBank.filter(g => g.versions && g.versions.length > 0);
            }

            function hideAllViews() {
                document.querySelectorAll('.view').forEach(v => v.classList.add('hidden'));
            }

            function showView(id) {
                hideAllViews();
                document.getElementById(id).classList.remove('hidden');
            }

            function showHeaderSubtitle(show) {
                const subtitle = document.getElementById('header-subtitle');
                if (show) {
                    subtitle.classList.remove('hidden');
                    if (state.mode === 'lessons') {
                        subtitle.innerText = "Välj område för att titta på videogenomgångar";
                    } else {
                        subtitle.innerText = "Välj område och nivå för att börja öva";
                    }
                } else {
                    subtitle.classList.add('hidden');
                }
            }

            function showTabs(show) {
                const tabs = document.getElementById('mode-tabs');
                if (show) {
                    tabs.classList.remove('hidden');
                } else {
                    tabs.classList.add('hidden');
                }
            }

            function createButton(text, onClick, colorClass = 'bg-gradient-to-r from-indigo-600 to-violet-600 shadow-indigo-900/50 hover:shadow-indigo-700/60') {
                const btn = document.createElement('button');
                btn.className = `w-full text-left p-4 rounded-xl text-white font-semibold shadow-lg transition-all duration-300 hover:scale-[1.02] hover:shadow-xl ${colorClass}`;
                btn.innerText = text;
                btn.onclick = onClick;
                return btn;
            }

            function createBackButton(onClick) {
                const btn = document.createElement('button');
                btn.className = 'mb-6 flex items-center gap-2 text-slate-400 hover:text-white transition-colors duration-200 group font-medium';
                btn.innerHTML = `<svg class="w-5 h-5 transition-transform group-hover:-translate-x-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg> Tillbaka`;
                btn.onclick = onClick;
                return btn;
            }

            function formatContent(text) {
                if (!text) return '';
                let html = String(text);
                
                const images = [];
                const tables = [];

                html = html.replace(/!\[(.*?)\]\((.*?)\)/g, (match, alt, url) => {
                    if (url.endsWith('.pdf')) {
                        images.push(`<iframe src="${url}" alt="${alt}"></iframe>`);
                    } else {
                        images.push(`<img src="${url}" alt="${alt}">`);
                    }
                    return `[[IMG_${images.length - 1}]]`;
                });
                
                html = html.replace(/img:\s*["']([^"']+)["']/g, (match, url) => {
                    if (url.endsWith('.pdf')) {
                        images.push(`<iframe src="${url}"></iframe>`);
                    } else {
                        images.push(`<img src="${url}" alt="Exempel">`);
                    }
                    return `[[IMG_${images.length - 1}]]`;
                });

                html = html.replace(/\{table\s+([\s\S]*?)\}/g, (match, content) => {
                    const rows = content.split('\n').filter(r => r.trim() !== '');
                    if (rows.length === 0) return '';
                    
                    let tableHtml = '<table class="math-table"><thead><tr>';
                    let headers = rows[0].split('|').map(h => h.trim());
                    headers.forEach(h => {
                        tableHtml += `<th>${h}</th>`;
                    });
                    tableHtml += '</tr></thead><tbody>';
                    
                    for (let i = 1; i < rows.length; i++) {
                        let cols = rows[i].split('|').map(c => c.trim());
                        tableHtml += '<tr>';
                        cols.forEach(c => {
                            tableHtml += `<td>${c}</td>`;
                        });
                        tableHtml += '</tr>';
                    }
                    tableHtml += '</tbody></table>';
                    
                    tables.push(tableHtml);
                    return `[[TABLE_${tables.length - 1}]]`;
                });
                
                html = html.replace(/<br\s*\/?>/g, '[[BR]]');
                html = html.replace(/<ul>/g, '[[UL]]');
                html = html.replace(/<\/ul>/g, '[[UL_END]]');
                html = html.replace(/<li>/g, '[[LI]]');
                html = html.replace(/<\/li>/g, '[[LI_END]]');
                html = html.replace(/<b>/g, '[[B]]');
                html = html.replace(/<\/b>/g, '[[B_END]]');
                html = html.replace(/<i>/g, '[[I]]');
                html = html.replace(/<\/i>/g, '[[I_END]]');
                
                html = html.replace(/</g, '&lt;').replace(/>/g, '&gt;');
                
                html = html.replace(/\[\[BR\]\]/g, '<br>');
                html = html.replace(/\[\[UL\]\]/g, '<ul class="list-disc pl-6 mt-2 space-y-1">');
                html = html.replace(/\[\[UL_END\]\]/g, '</ul>');
                html = html.replace(/\[\[LI\]\]/g, '<li>');
                html = html.replace(/\[\[LI_END\]\]/g, '</li>');
                html = html.replace(/\[\[B\]\]/g, '<strong>');
                html = html.replace(/\[\[B_END\]\]/g, '</strong>');
                html = html.replace(/\[\[I\]\]/g, '<em>');
                html = html.replace(/\[\[I_END\]\]/g, '</em>');
                
                html = html.replace(/\[\[IMG_(\d+)\]\]/g, (match, idx) => images[parseInt(idx)]);
                html = html.replace(/\[\[TABLE_(\d+)\]\]/g, (match, idx) => tables[parseInt(idx)]);
                
                return html;
            }

            function renderMath(elementId) {
                if(window.MathJax && MathJax.typesetPromise) {
                    MathJax.typesetPromise([document.getElementById(elementId)]);
                }
            }

            function renderLessonVideos(container) {
                if (!state.lessonVideos.length) return;

                const heading = document.createElement('h2');
                heading.className = 'text-lg font-bold text-slate-300 mb-3';
                heading.innerText = 'Genomgångar i lektionen';
                container.appendChild(heading);

                const buttons = document.createElement('div');
                buttons.className = 'space-y-3';
                state.lessonVideos.forEach(video => {
                    const button = document.createElement('button');
                    button.type = 'button';
                    button.className = 'w-full text-left p-4 rounded-xl bg-slate-800 hover:bg-slate-700 text-white font-semibold shadow-lg transition-all duration-300 flex items-center gap-4 border border-slate-700';

                    const icon = document.createElement('span');
                    icon.className = 'flex items-center justify-center w-10 h-10 rounded-full bg-sky-500/20 text-sky-400 border border-sky-500/30 shrink-0';
                    icon.innerHTML = '<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>';

                    const text = document.createElement('span');
                    text.className = 'flex flex-col text-left';
                    const title = document.createElement('span');
                    title.className = 'text-lg font-bold';
                    title.innerText = video.title;
                    text.appendChild(title);
                    if (video.subTitle) {
                        const subtitle = document.createElement('span');
                        subtitle.className = 'text-sm font-normal text-slate-400';
                        subtitle.innerText = video.subTitle;
                        text.appendChild(subtitle);
                    }

                    button.append(icon, text);
                    button.onclick = () => openVideoModal(video.lessonVideo, video.title);
                    buttons.appendChild(button);
                });
                container.appendChild(buttons);
            }

            // --- VY: KURSER ---
            function renderCourses() {
                showView('view-courses');
                showHeaderSubtitle(true);
                showTabs(true);
                const view = document.getElementById('view-courses');
                
                const currentBank = getCurrentBank();
                const courses = [...new Set(currentBank.flatMap(g => g.courses || []))].sort();
                
                view.innerHTML = state.mode === 'lessons'
                    ? ''
                    : '<h2 class="text-xl font-bold mb-5 text-slate-300 tracking-wide">Välj kurs för att öva</h2>';
                const container = document.createElement('div');
                container.className = 'space-y-4';
                
                if(courses.length === 0) {
                     container.innerHTML = '<p class="text-amber-400 bg-amber-900/20 p-4 rounded-lg border border-amber-500/30">Det finns inga genomgångar ännu.</p>';
                } else {
                    courses.forEach(course => {
                        container.appendChild(createButton(course, () => selectCourse(course), 'bg-gradient-to-r from-indigo-600 to-blue-600 shadow-indigo-900/40 hover:shadow-indigo-700/60'));
                    });
                }

                view.appendChild(container);

                if (state.mode !== 'lessons') {
                    const lessonCodeBox = document.createElement('div');
                    lessonCodeBox.className = 'bg-slate-900/60 p-5 rounded-xl border border-indigo-500/30 mt-8 shadow-lg';
                    lessonCodeBox.innerHTML = `
                        <form id="lesson-code-form">
                            <label for="lesson-code-input" class="block text-lg font-bold text-slate-200 mb-3">Har du en lektionskod?</label>
                            <div class="flex flex-col sm:flex-row gap-3">
                                <input id="lesson-code-input" type="text" maxlength="24" autocomplete="off" required
                                    placeholder="Skriv lektionskoden"
                                    class="flex-1 min-w-0 px-4 py-3 rounded-lg bg-slate-950 border border-slate-700 text-white placeholder-slate-500 focus:outline-none focus:border-indigo-400">
                                <button type="submit" class="px-5 py-3 rounded-lg bg-gradient-to-r from-indigo-600 to-violet-600 text-white font-bold shadow-lg hover:from-indigo-500 hover:to-violet-500 transition">
                                    Gå till lektion
                                </button>
                            </div>
                            <p id="lesson-code-error" class="hidden mt-3 text-sm text-red-300" role="alert"></p>
                        </form>
                    `;
                    lessonCodeBox.querySelector('#lesson-code-form').onsubmit = event => {
                        event.preventDefault();
                        joinLesson(lessonCodeBox.querySelector('#lesson-code-input').value);
                    };
                    view.appendChild(lessonCodeBox);
                }
            }

            // --- VY: OMRÅDEN ---
            function renderAreas() {
                showView('view-areas');
                showHeaderSubtitle(true);
                showTabs(true);
                const view = document.getElementById('view-areas');
                const currentBank = getCurrentBank();
                
                const areas = [...new Set(currentBank.filter(g => g.courses.includes(state.currentCourse)).map(g => g.area))].sort();
                
                view.innerHTML = '';
                view.appendChild(createBackButton(() => renderCourses()));
                
                const title = document.createElement('h2');
                title.className = 'text-xl font-bold mb-5 text-slate-300 tracking-wide';
                title.innerText = '2. Välj område';
                view.appendChild(title);
                
                const container = document.createElement('div');
                container.className = 'space-y-4';
                
                areas.forEach(area => {
                    container.appendChild(createButton(area, () => selectArea(area), 'bg-gradient-to-r from-violet-600 to-indigo-600 shadow-violet-900/40 hover:shadow-violet-700/60'));
                });

                view.appendChild(container);
            }

            // --- VY: DELOMRÅDEN (Endast för uppgiftsläget) ---
            function renderSubAreas() {
                if (state.mode === 'lessons') {
                    renderAreas();
                    return;
                }
            
                showView('view-subareas');
                showHeaderSubtitle(true);
                showTabs(true);
                const view = document.getElementById('view-subareas');
                
                // FIX: Använd getCurrentBank() istället för taskBank så att videogenomgångar filtreras bort
                const currentBank = getCurrentBank();
                const groupsInArea = currentBank.filter(g => g.courses.includes(state.currentCourse) && g.area === state.currentArea);
                const subAreas = [...new Set(groupsInArea.map(g => g.subArea))].sort();
                
                view.innerHTML = '';
                view.appendChild(createBackButton(() => renderAreas()));
                
                const title = document.createElement('h2');
                title.className = 'text-xl font-bold mb-5 text-slate-300 tracking-wide';
                title.innerText = `3. Välj delområde inom ${state.currentArea}`;
                view.appendChild(title);
                
                const container = document.createElement('div');
                container.className = 'space-y-4';
                
                container.appendChild(createButton(`Alla uppgifter på ${state.currentArea}`, () => selectSubArea('all'), 'bg-gradient-to-r from-purple-600 to-violet-600 shadow-purple-900/40 hover:shadow-purple-700/60'));
                
                subAreas.forEach(sub => {
                    container.appendChild(createButton(sub, () => selectSubArea(sub), 'bg-gradient-to-r from-purple-600 to-fuchsia-600 shadow-purple-900/40 hover:shadow-fuchsia-700/60'));
                });
            
                view.appendChild(container);
            }

            // --- VY: SVÅRIGHETSGRAD ELLER VIDEOMENY ---
            function renderDifficulty() {
                showView('view-difficulty');
                showHeaderSubtitle(true);
                showTabs(true);
                const view = document.getElementById('view-difficulty');
                const currentBank = getCurrentBank();
                
                let filteredGroups = currentBank.filter(g => g.courses.includes(state.currentCourse) && g.area === state.currentArea);
                if(state.mode === 'tasks' && state.currentSubArea !== 'all') {
                    filteredGroups = filteredGroups.filter(g => g.subArea === state.currentSubArea);
                }
                
                const subAreaText = state.mode === 'lessons' ? state.currentArea : (state.currentSubArea === 'all' ? state.currentArea : state.currentSubArea);

                view.innerHTML = '';
                
                if (state.mode === 'lessons') {
                    view.appendChild(createBackButton(() => renderAreas()));
                } else {
                    view.appendChild(createBackButton(() => renderSubAreas()));
                }
                
                const title = document.createElement('h2');
                title.className = 'text-xl font-bold mb-5 text-slate-300 tracking-wide';
                
                const container = document.createElement('div');
                container.className = 'space-y-4';

                if (state.mode === 'lessons') {
                    title.innerText = `Videogenomgångar för ${state.currentArea}`;
                    view.appendChild(title);

                    if (filteredGroups.length === 0) {
                        container.innerHTML = '<p class="text-amber-400 bg-amber-900/20 p-4 rounded-lg border border-amber-500/30">Det finns inga videogenomgångar för detta område.</p>';
                    } else {
                        filteredGroups.sort((a, b) => {
                            const idA = parseInt(a.areaId || 0);
                            const idB = parseInt(b.areaId || 0);
                            return idA - idB;
                        });

                        filteredGroups.forEach(lesson => {
                            const btn = document.createElement('button');
                            btn.className = 'w-full text-left p-4 rounded-xl bg-slate-800 hover:bg-slate-700 text-white font-semibold shadow-lg transition-all duration-300 hover:scale-[1.02] flex items-center gap-4 border border-slate-700';
                            btn.innerHTML = `
                                <span class="flex items-center justify-center w-10 h-10 rounded-full bg-sky-500/20 text-sky-400 border border-sky-500/30 shrink-0">
                                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                                </span>
                                <span class="flex flex-col text-left">
                                    <span class="text-lg font-bold">${lesson.title}</span>
                                    ${lesson.subTitle ? `<span class="text-sm font-normal text-slate-400">${lesson.subTitle}</span>` : ''}
                                </span>
                            `;
                            btn.onclick = () => openVideoModal(lesson.lessonVideo, lesson.title);
                            container.appendChild(btn);
                        });
                    }
                } else {
                    title.innerText = `4. Välj nivå för ${subAreaText}`;
                    view.appendChild(title);

                    const availableDifficulties = [...new Set(filteredGroups.filter(g => g.difficulty).map(g => g.difficulty))].sort();
                    
                    if(availableDifficulties.length === 0) {
                        container.innerHTML = '<p class="text-red-400 bg-red-900/20 p-4 rounded-lg border border-red-500/30">Inga uppgifter finns för detta urval.</p>';
                    } else {
                        availableDifficulties.forEach(diff => {
                            const label = diff === 1 ? 'Nivå 1 (Grund)' : diff === 2 ? 'Nivå 2 (Medel)' : 'Nivå 3 (Svår)';
                            container.appendChild(createButton(label, () => selectDifficulty(diff), 'bg-gradient-to-r from-fuchsia-600 to-pink-600 shadow-fuchsia-900/40 hover:shadow-pink-700/60'));
                        });
                    }
                }

                view.appendChild(container);
            }

            // --- VY: UPPGIFT ---
            function renderTask() {
                showView('view-task');
                showHeaderSubtitle(false);
                showTabs(false);
                const view = document.getElementById('view-task');
                
                if(state.tasks.length === 0) {
                    if (state.activeLesson) {
                        renderLessonMenu();
                        return;
                    }

                    view.innerHTML = '';
                    view.appendChild(createBackButton(() => renderDifficulty()));
                    const errorMsg = document.createElement('p');
                    errorMsg.className = 'text-center text-red-400 mt-10 bg-red-900/20 p-4 rounded-lg border border-red-500/30';
                    errorMsg.innerText = 'Det finns inga uppgifter för detta urval.';
                    view.appendChild(errorMsg);
                    return;
                }

                const task = state.tasks[state.currentTaskIndex];
                const taskNum = state.currentTaskIndex + 1;
                const totalTasks = state.tasks.length;
                const isFirstTask = state.currentTaskIndex === 0;

                const currentExample = state.examplesMap[task.groupId] || null;
                const hasTextExp = !!task.exp;
                const hasVideo = !!task.video;

                const calcIcon = `<svg class="w-5 h-5 mr-2 text-indigo-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z"></path></svg>`;
                const infoIcon = `<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>`;

                view.innerHTML = `
                    <div class="flex justify-between items-center mb-6">
                        <button id="btn-leave-task" class="flex items-center gap-2 text-slate-300 hover:text-white transition-colors duration-200 group font-medium bg-slate-800/50 hover:bg-slate-800 px-4 py-2 rounded-lg border border-slate-700">
                            <svg class="w-4 h-4 transition-transform group-hover:-translate-x-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg> ${state.activeLesson ? 'Tillbaka till lektionen' : 'Avsluta'}
                        </button>
                        <div class="flex items-center gap-3">
                            ${currentExample ? `
                                <button id="btn-show-example" class="flex items-center gap-1.5 text-indigo-300 hover:text-indigo-200 font-semibold text-sm tracking-wider transition-colors duration-200 bg-indigo-900/30 hover:bg-indigo-900/50 px-3 py-2 rounded-lg border border-indigo-500/30">
                                    ${infoIcon} Exempel
                                </button>
                            ` : ''}
                            ${!state.activeLesson ? `
                                <button onclick="randomTask()" aria-label="Slumpa uppgift" title="Slumpa uppgift" class="flex items-center justify-center bg-slate-800/50 hover:bg-slate-800 px-3 py-2 rounded-lg border border-slate-700 text-slate-400 hover:text-white transition-colors disabled:opacity-40 disabled:cursor-not-allowed" ${totalTasks < 2 ? 'disabled' : ''}>
                                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M3 7h2c5 0 7 10 12 10h4m-4-4 4 4-4 4M3 17h2c2 0 3-2 4-4m4-6c1-2 2-4 4-4h4m-4-4 4 4-4 4"></path></svg>
                                </button>
                            ` : ''}
                            <span class="font-bold text-sm text-slate-400 tracking-wider bg-slate-800/50 px-3 py-2 rounded-lg border border-slate-700">${taskNum} / ${totalTasks}</span>
                        </div>
                    </div>
                    
                    <div class="flex justify-between items-center mb-5 gap-3">
                        <p class="text-sm text-slate-500 font-medium truncate">${task.groupId}</p>
                        ${!state.activeLesson && state.taskTypes.length > 1 ? '<button onclick="nextTaskType()" class="ml-auto text-right text-sm text-slate-500 hover:text-slate-300 transition-colors whitespace-nowrap">Nästa uppgiftstyp &rarr;</button>' : ''}
                    </div>

                    ${currentExample ? `
                        <div id="example-box" class="hidden bg-indigo-900/20 p-5 rounded-xl border border-indigo-500/40 mb-4 shadow-lg shadow-indigo-900/20 backdrop-blur-sm">
                            <p class="font-bold text-indigo-300 text-sm tracking-wider mb-3 flex items-center gap-2">${infoIcon} EXEMPEL OCH FÖRKLARING</p>
                            <div id="task-example" class="mt-1 text-indigo-100 math-question">
                                ${formatContent(currentExample)}
                            </div>
                        </div>
                    ` : ''}

                    <div class="bg-slate-900/60 p-6 rounded-xl shadow-xl mb-6 border border-slate-700/50 backdrop-blur-sm">
                        <div id="task-question" class="math-question text-slate-100">
                            ${formatContent(task.question)}
                            ${task.img ? `<img src="${task.img}" alt="Uppgiftsbild" class="mt-4 rounded-lg border border-slate-700">` : ''}
                        </div>
                        ${task.calculator ? `<div class="mt-5 pt-4 border-t border-slate-700/50 text-sm text-indigo-300 flex items-center font-medium">${calcIcon} Räknare tillåten</div>` : ''}
                    </div>

                    ${hasVideo ? `
                        <div class="mb-4">
                            <button onclick="showVideoSolution()" class="w-full p-3 rounded-lg bg-indigo-900/40 hover:bg-indigo-900/60 text-indigo-300 font-medium transition text-sm border border-indigo-500/30">
                                Visa videolösning
                            </button>
                        </div>
                    ` : ''}

                    <div id="check-answer-container" class="mb-4">
                        <button onclick="showAnswer()" class="w-full p-4 rounded-xl bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-400 hover:to-teal-400 text-white font-bold shadow-lg shadow-emerald-900/40 transition-all duration-300 hover:scale-[1.02] hover:shadow-emerald-700/50">
                            Kontrollera svar
                        </button>
                    </div>

                    <div id="answer-box" class="hidden bg-slate-900/60 p-6 rounded-xl border border-emerald-500/30 mb-4 shadow-lg shadow-emerald-900/10 backdrop-blur-sm">
                        <p class="font-bold text-emerald-400 text-sm tracking-wider mb-3">FACIT</p>
                        <div id="task-answer" class="mt-1 text-emerald-300 math-question">
                            ${formatContent(task.solution)}
                        </div>
                        
                        ${hasTextExp ? `
                            <div class="mt-5 border-t border-slate-700/50 pt-4">
                                <button id="btn-text-sol" onclick="showTextSolution()" class="w-full p-3 rounded-lg bg-emerald-900/40 hover:bg-emerald-900/60 text-emerald-300 font-medium transition text-sm border border-emerald-500/30">
                                    Visa lösningsgång
                                </button>
                            </div>
                            <div id="solution-text-box" class="hidden mt-4 pt-4 border-t border-slate-700/50 text-slate-300 math-question text-base leading-relaxed">
                                ${formatContent(task.exp)}
                            </div>
                        ` : ''}
                    </div>

                    <div class="flex gap-4">
                        <button onclick="prevTask()" class="flex-1 p-4 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold shadow-lg shadow-black/40 transition-all duration-300 border border-slate-700/50 hover:scale-[1.02] ${isFirstTask ? 'opacity-40 pointer-events-none' : ''}">
                            &larr; Föregående
                        </button>
                        <button onclick="nextTask()" class="flex-1 p-4 rounded-xl bg-gradient-to-r from-slate-800 to-slate-700 hover:from-slate-700 hover:to-slate-600 text-white font-semibold shadow-lg shadow-black/40 transition-all duration-300 border border-slate-600/50 hover:scale-[1.02]">
                            Nästa &rarr;
                        </button>
                    </div>
                `;

                if (state.activeLesson) {
                    const lessonTitle = document.createElement('p');
                    lessonTitle.className = 'text-sm font-bold uppercase tracking-wider text-indigo-300 mb-4';
                    lessonTitle.innerText = state.activeLesson.title;
                    view.insertBefore(lessonTitle, view.firstChild);
                }

                document.getElementById('btn-leave-task').onclick = state.activeLesson ? renderLessonMenu : renderDifficulty;
                
                if (currentExample && document.getElementById('btn-show-example')) {
                    document.getElementById('btn-show-example').onclick = () => {
                        const exBox = document.getElementById('example-box');
                        exBox.classList.toggle('hidden');
                        if (!exBox.classList.contains('hidden')) {
                            renderMath('task-example');
                        }
                    };
                }

                renderMath('task-question');
                renderMath('task-answer');
            }

            // --- LOGIKFUNKTIONER ---
            window.renderCourses = renderCourses;
            window.renderAreas = renderAreas;
            window.renderSubAreas = renderSubAreas;
            window.renderDifficulty = renderDifficulty;
            window.showAnswer = showAnswer;
            window.showTextSolution = showTextSolution;
            window.showVideoSolution = showVideoSolution;
            window.nextTask = nextTask;
            window.prevTask = prevTask;
            window.randomTask = randomTask;
            window.nextTaskType = nextTaskType;
            window.switchMode = switchMode;
            window.openVideoModal = openVideoModal;
            window.closeVideoModal = closeVideoModal;
            window.joinLesson = joinLesson;

            function switchMode(mode) {
                state.mode = mode;
                
                const tabTasks = document.getElementById('tab-tasks');
                const tabLessons = document.getElementById('tab-lessons');
                
                if (mode === 'tasks') {
                    tabTasks.className = 'px-6 py-2 rounded-lg font-semibold transition-all duration-300 bg-gradient-to-r from-indigo-600 to-violet-600 text-white shadow-lg';
                    tabLessons.className = 'px-6 py-2 rounded-lg font-semibold transition-all duration-300 text-slate-400 hover:text-white';
                } else {
                    tabLessons.className = 'px-6 py-2 rounded-lg font-semibold transition-all duration-300 bg-gradient-to-r from-sky-600 to-cyan-600 text-white shadow-lg';
                    tabTasks.className = 'px-6 py-2 rounded-lg font-semibold transition-all duration-300 text-slate-400 hover:text-white';
                }
                
                state.currentCourse = null;
                state.currentArea = null;
                state.currentSubArea = null;
                renderCourses();
            }

            function joinLesson(code) {
                const error = document.getElementById('lesson-code-error');
                const normalizedCode = String(code || '').trim().toUpperCase();
                const lessons = typeof lessonBank !== 'undefined' && Array.isArray(lessonBank) ? lessonBank : [];
                const lesson = lessons.find(item => String(item.code || '').trim().toUpperCase() === normalizedCode);

                if (!lesson) {
                    error.innerText = lessons.length
                        ? 'Lektionskoden känns inte igen. Kontrollera koden och försök igen.'
                        : 'Lektionsbanken kunde inte läsas in. Kontrollera att lesson-bank.js finns i samma mapp som index.html.';
                    error.classList.remove('hidden');
                    return;
                }

                const taskLectionIds = Array.isArray(lesson.taskLectionIds) ? lesson.taskLectionIds : [];
                const videoIds = Array.isArray(lesson.videoIds) ? lesson.videoIds : [];
                const taskByLectionId = new Map(taskBank.flatMap(group => (group.versions || [])
                    .filter(version => version.lectionid !== undefined && version.versionLabel !== 'Ex')
                    .map(version => [String(version.lectionid), {
                        ...version,
                        groupId: group.groupId,
                        calculator: group.calculator || false,
                        difficulty: group.difficulty,
                        area: group.area,
                        subArea: group.subArea
                    }])));
                const videoById = new Map(taskBank
                    .filter(group => group.videoId && group.lessonVideo)
                    .map(group => [String(group.videoId), group]));
                const missingTaskLectionIds = taskLectionIds.filter(id => !taskByLectionId.has(String(id)));
                const missingVideoIds = videoIds.filter(id => !videoById.has(String(id)));

                if (missingTaskLectionIds.length || missingVideoIds.length || (!taskLectionIds.length && !videoIds.length)) {
                    error.innerText = 'Lektionen är felkonfigurerad. Kontrollera uppgifternas lectionid och video-id:n i tasks.js.';
                    error.classList.remove('hidden');
                    return;
                }

                state.activeLesson = lesson;
                state.lessonVideos = videoIds.map(id => videoById.get(String(id)));
                state.lessonTasks = taskLectionIds.map(id => taskByLectionId.get(String(id)));
                state.tasks = [];
                state.examplesMap = {};
                state.taskTypes = [];
                state.currentTaskIndex = 0;
                state.mode = 'lesson';

                renderLessonMenu();
            }

            function renderLessonMenu() {
                showView('view-task');
                showHeaderSubtitle(false);
                showTabs(false);
                const view = document.getElementById('view-task');
                view.innerHTML = '';

                const header = document.createElement('div');
                header.className = 'flex justify-between items-center mb-6 gap-4';
                const title = document.createElement('h2');
                title.className = 'text-xl font-bold text-slate-200';
                title.innerText = state.activeLesson.title;
                const leaveButton = document.createElement('button');
                leaveButton.className = 'text-slate-300 hover:text-white bg-slate-800 px-4 py-2 rounded-lg border border-slate-700 shrink-0';
                leaveButton.innerText = 'Avsluta lektion';
                leaveButton.onclick = exitLesson;
                header.append(title, leaveButton);
                view.appendChild(header);

                const options = document.createElement('div');
                options.className = 'space-y-4';

                if (state.lessonVideos.length) {
                    options.appendChild(createButton('Titta på genomgångar', renderLessonVideosView, 'bg-gradient-to-r from-sky-600 to-cyan-600 shadow-sky-900/40 hover:shadow-cyan-700/60'));
                }

                const availableDifficulties = [...new Set(state.lessonTasks.map(task => task.difficulty).filter(Boolean))].sort((a, b) => a - b);
                availableDifficulties.forEach(diff => {
                    options.appendChild(createButton(`Lös uppgifter på nivå ${diff}`, () => startLessonLevel(diff), 'bg-gradient-to-r from-fuchsia-600 to-pink-600 shadow-fuchsia-900/40 hover:shadow-pink-700/60'));
                });
                view.appendChild(options);
            }

            function renderLessonVideosView() {
                showView('view-task');
                showHeaderSubtitle(false);
                showTabs(false);
                const view = document.getElementById('view-task');
                view.innerHTML = '';
                view.appendChild(createBackButton(renderLessonMenu));

                const videos = document.createElement('div');
                videos.className = 'bg-slate-900/60 p-5 rounded-xl border border-slate-700/50';
                renderLessonVideos(videos);
                view.appendChild(videos);
            }

            function startLessonLevel(difficulty) {
                state.currentDifficulty = difficulty;
                state.tasks = state.lessonTasks.filter(task => task.difficulty === difficulty);
                state.examplesMap = {};
                state.taskTypes = [];
                state.currentTaskIndex = 0;

                state.tasks.forEach((task, index) => {
                    const group = taskBank.find(item => item.groupId === task.groupId);
                    const example = (group.versions || []).find(version => version.versionLabel === 'Ex' && version.example);
                    if (example) state.examplesMap[task.groupId] = example.example;

                    if (!state.taskTypes.some(type => type.id === task.groupId)) {
                        state.taskTypes.push({ id: task.groupId, startIndex: index });
                    }
                });

                renderTask();
            }

            function exitLesson() {
                state.activeLesson = null;
                state.lessonVideos = [];
                state.lessonTasks = [];
                state.tasks = [];
                state.taskTypes = [];
                state.examplesMap = {};
                state.currentTaskIndex = 0;
                switchMode('tasks');
            }

            function selectCourse(course) {
                state.currentCourse = course;
                renderAreas();
            }

            function selectArea(area) {
                state.currentArea = area;
                
                if (state.mode === 'lessons') {
                    state.currentSubArea = 'all'; 
                    renderDifficulty();
                } else {
                    renderSubAreas();
                }
            }

            function selectSubArea(subArea) {
                state.currentSubArea = subArea;
                renderDifficulty();
            }

            function selectDifficulty(diff) {
                state.currentDifficulty = diff;
                
                let filteredGroups = taskBank.filter(g => 
                    g.courses.includes(state.currentCourse) && 
                    g.area === state.currentArea && 
                    g.difficulty === state.currentDifficulty
                );

                if(state.currentSubArea !== 'all') {
                    filteredGroups = filteredGroups.filter(g => g.subArea === state.currentSubArea);
                }

                state.examplesMap = {};
                state.taskTypes = []; 
                state.tasks = filteredGroups.flatMap(g => {
                    const ex = (g.versions || []).find(v => v.versionLabel === "Ex");
                    if (ex && ex.example) {
                        state.examplesMap[g.groupId] = ex.example;
                    }
                    
                    return (g.versions || [])
                        .filter(v => v.versionLabel !== "Ex")
                        .map(v => ({
                            ...v, 
                            groupId: g.groupId,
                            calculator: g.calculator || false,
                            area: g.area,
                            subArea: g.subArea
                        }));
                });

                let seenGroups = new Set();
                state.tasks.forEach((task, index) => {
                    if (!seenGroups.has(task.groupId)) {
                        seenGroups.add(task.groupId);
                        state.taskTypes.push({ id: task.groupId, startIndex: index });
                    }
                });

                state.currentTaskIndex = 0;
                renderTask();
            }

            function showAnswer() {
                document.getElementById('check-answer-container').classList.add('hidden');
                document.getElementById('answer-box').classList.remove('hidden');
            }

            function showTextSolution() {
                const txtBtn = document.getElementById('btn-text-sol');
                const txtBox = document.getElementById('solution-text-box');
                if (txtBtn) txtBtn.classList.add('hidden');
                if (txtBox) {
                    txtBox.classList.remove('hidden');
                    renderMath('solution-text-box');
                }
            }

            function showVideoSolution() {
                const task = state.tasks[state.currentTaskIndex];
                const title = task.id ? `Videolösning – uppgift ${task.id}` : 'Videolösning';
                openVideoModal(task.video, title);
            }

            function openVideoModal(url, title) {
                const modal = document.getElementById('lesson-modal');
                const titleEl = document.getElementById('modal-title');
                const container = document.getElementById('modal-video-container');
                
                titleEl.innerText = title || 'GENOMGÅNG';

                const videoUrl = new URL(url, window.location.href);
                const host = videoUrl.hostname.toLowerCase().replace(/^www\./, '');
                let videoId = '';
                if (host === 'youtu.be') {
                    videoId = videoUrl.pathname.split('/').filter(Boolean)[0] || '';
                } else if (host === 'youtube.com' || host === 'm.youtube.com') {
                    if (videoUrl.pathname === '/watch') {
                        videoId = videoUrl.searchParams.get('v') || '';
                    } else {
                        const videoMatch = videoUrl.pathname.match(/^\/(?:embed|shorts)\/([^/]+)/);
                        videoId = videoMatch ? videoMatch[1] : '';
                    }
                }

                if (!/^[\w-]+$/.test(videoId)) {
                    container.innerText = 'Videolänken är ogiltig eller stöds inte. Använd en YouTube-länk.';
                    modal.classList.remove('hidden');
                    return;
                }

                container.innerHTML = `<iframe class="w-full h-full" src="https://www.youtube.com/embed/${videoId}" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
                modal.classList.remove('hidden');
            }

            function closeVideoModal() {
                const modal = document.getElementById('lesson-modal');
                const container = document.getElementById('modal-video-container');
                container.innerHTML = '';
                modal.classList.add('hidden');
            }

            function getCompletionTitle() {
                if (state.activeLesson && Number.isInteger(state.currentDifficulty)) {
                    return `Nivå ${state.currentDifficulty} klar!`;
                }
                if (state.activeLesson) {
                    return 'Lektion klar!';
                }
                return 'Snyggt jobbat!';
            }

            function nextTask() {
                if(state.currentTaskIndex < state.tasks.length - 1) {
                    state.currentTaskIndex++;
                    renderTask();
                } else {
                    const view = document.getElementById('view-task');
                    const completionTitle = getCompletionTitle();
                    view.innerHTML = `
                        <div class="text-center mt-10 bg-slate-900/60 p-10 rounded-xl border border-emerald-500/30 shadow-xl flex flex-col items-center backdrop-blur-sm">
                            <div class="w-20 h-20 rounded-full bg-gradient-to-br from-emerald-400 to-teal-500 flex items-center justify-center mb-6 shadow-lg shadow-emerald-500/30">
                                <svg class="w-10 h-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
                            </div>
                            <h2 class="text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-emerald-300 to-teal-300 mb-3">${completionTitle}</h2>
                            <p class="mb-8 text-slate-400">${state.activeLesson ? 'Du har gjort alla uppgifter i lektionen.' : 'Du har gjort alla uppgifter i detta område.'}</p>
                            <button id="btn-finish-task" class="w-full max-w-xs p-3 rounded-xl bg-gradient-to-r from-indigo-500 to-purple-500 hover:from-indigo-400 hover:to-purple-400 text-white font-bold shadow-lg shadow-indigo-900/40 transition-all duration-300 hover:scale-[1.02]">
                                ${state.activeLesson ? 'Tillbaka till lektionen' : 'Välj ny nivå / område'}
                            </button>
                        </div>
                    `;
                    document.getElementById('btn-finish-task').onclick = state.activeLesson ? renderLessonMenu : renderDifficulty;
                }
            }

            function randomTask() {
                if (state.activeLesson || state.tasks.length < 2) return;

                const availableIndexes = state.tasks
                    .map((_, index) => index)
                    .filter(index => index !== state.currentTaskIndex);
                state.currentTaskIndex = availableIndexes[Math.floor(Math.random() * availableIndexes.length)];
                renderTask();
            }

            function nextTaskType() {
                if (state.activeLesson || state.taskTypes.length < 2) return;

                const currentTypeIndex = state.taskTypes.findIndex(type => type.id === state.tasks[state.currentTaskIndex].groupId);
                if (currentTypeIndex === -1) return;

                const nextType = state.taskTypes[(currentTypeIndex + 1) % state.taskTypes.length];
                state.currentTaskIndex = nextType.startIndex;
                renderTask();
            }

            function prevTask() {
                if(state.currentTaskIndex > 0) {
                    state.currentTaskIndex--;
                    renderTask();
                }
            }

            renderCourses();
        }
    </script>
</body>
</html>
