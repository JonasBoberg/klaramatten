<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matematikträning</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Modern Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Tailwind Config -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    
    <!-- MathJax -->
    <script>
        MathJax = {
          tex: {
            inlineMath: [['\\(', '\\)']],
          }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>

    <style>
        .math-question {
            font-size: 1.25rem;
            line-height: 1.8;
        }
        /* Tvinga MathJax att ärva textfärgen (viktigt för dark mode) */
        mjx-container[jax="CHTML"] {
            color: inherit !important;
        }
        /* Stil för inbäddade bilder */
        .math-question img {
            max-width: 100%;
            height: auto;
            border-radius: 0.5rem;
            margin-top: 1rem;
            border: 1px solid rgba(255,255,255,0.1);
        }
    </style>
</head>
<!-- ÄNDRING HÄR: Tagit bort justify-center, lagt till py-10 så att den fäster uppifrån med lite luft -->
<body class="bg-slate-900 min-h-screen flex flex-col items-center py-10 px-4 font-sans text-slate-200">

    <div id="app" class="w-full max-w-xl">
        <!-- Header -->
        <div class="text-center mb-10">
            <h1 class="text-4xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 to-teal-400 pb-1">Klara Matten!</h1>
            <p class="text-slate-400 mt-3 text-lg">Välj område och nivå för att börja öva</p>
        </div>

        <!-- Vy: Välj Kurs -->
        <div id="view-courses" class="view"></div>

        <!-- Vy: Välj Område -->
        <div id="view-areas" class="view hidden"></div>

        <!-- Vy: Välj Delområde -->
        <div id="view-subareas" class="view hidden"></div>

        <!-- Vy: Välj Svårighetsgrad -->
        <div id="view-difficulty" class="view hidden"></div>

        <!-- Vy: Uppgift -->
        <div id="view-task" class="view hidden"></div>
    </div>

    <!-- Länk till din externa uppgiftsbank -->
    <script src="tasks.js"></script>

    <!-- Huvudlogik -->
    <script>
        // --- ROBUSTHETSCHECK ---
        if (typeof taskBank === 'undefined' || !Array.isArray(taskBank) || taskBank.length === 0) {
            document.getElementById('view-courses').innerHTML = `
                <div class="bg-red-900/30 border border-red-500/50 text-red-300 px-6 py-4 rounded-xl relative text-center backdrop-blur-sm" role="alert">
                    <strong class="font-bold">Fel: Hittar ingen uppgiftsbank!</strong><br>
                    <span class="block sm:inline mt-2 text-sm">Säkerställ att filen <u>tasks.js</u> ligger i samma mapp som index.html, och att databasen heter <u>const taskBank = [ ... ]</u> (inte export).</span>
                </div>
            `;
        } else {
            initializeApp();
        }

        function initializeApp() {
            let state = {
                currentCourse: null,
                currentArea: null,
                currentSubArea: null,
                currentDifficulty: null,
                tasks: [],
                currentTaskIndex: 0
            };

            function hideAllViews() {
                document.querySelectorAll('.view').forEach(v => v.classList.add('hidden'));
            }

            function showView(id) {
                hideAllViews();
                document.getElementById(id).classList.remove('hidden');
            }

            function createButton(text, onClick, colorClass = 'bg-indigo-600 hover:bg-indigo-500') {
                const btn = document.createElement('button');
                btn.className = `w-full text-left p-4 rounded-xl text-white font-semibold shadow-sm transition-all duration-200 hover:scale-[1.02] hover:shadow-md ${colorClass}`;
                btn.innerText = text;
                btn.onclick = onClick;
                return btn;
            }

            function createBackButton(onClick) {
                const btn = document.createElement('button');
                btn.className = 'mb-6 flex items-center gap-2 text-slate-400 hover:text-slate-200 transition-colors duration-200 group';
                btn.innerHTML = `<svg class="w-4 h-4 transition-transform group-hover:-translate-x-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg> Tillbaka`;
                btn.onclick = onClick;
                return btn;
            }

            // Hjälpfunktion för att formattera text och omvandla Markdown-bilder till HTML-bilder
            function formatContent(text) {
                if (!text) return '';
                let htmlString = String(text);
                // Leta efter markdown-bilder: ![alt-text](bildlänk) och gör om till <img>
                htmlString = htmlString.replace(/!\[(.*?)\]\((.*?)\)/g, '<img src="$2" alt="$1">');
                return htmlString;
            }

            function renderMath(elementId) {
                if(window.MathJax && MathJax.typesetPromise) {
                    MathJax.typesetPromise([document.getElementById(elementId)]);
                }
            }

            // --- VY: KURSER ---
            function renderCourses() {
                showView('view-courses');
                const view = document.getElementById('view-courses');
                
                const courses = [...new Set(taskBank.flatMap(g => g.courses || []))].sort();
                
                view.innerHTML = '<h2 class="text-xl font-bold mb-5 text-slate-300">1. Välj din kurs</h2>';
                const container = document.createElement('div');
                container.className = 'space-y-3';
                
                courses.forEach(course => {
                    container.appendChild(createButton(course, () => selectCourse(course), 'bg-indigo-600 hover:bg-indigo-500'));
                });

                view.appendChild(container);
            }

            // --- VY: OMRÅDEN ---
            function renderAreas() {
                showView('view-areas');
                const view = document.getElementById('view-areas');
                
                const areas = [...new Set(taskBank.filter(g => g.courses.includes(state.currentCourse)).map(g => g.area))].sort();
                
                view.innerHTML = '';
                view.appendChild(createBackButton(() => renderCourses()));
                
                const title = document.createElement('h2');
                title.className = 'text-xl font-bold mb-5 text-slate-300';
                title.innerText = '2. Välj område';
                view.appendChild(title);
                
                const container = document.createElement('div');
                container.className = 'space-y-3';
                
                areas.forEach(area => {
                    container.appendChild(createButton(area, () => selectArea(area), 'bg-teal-600 hover:bg-teal-500'));
                });

                view.appendChild(container);
            }

            // --- VY: DELOMRÅDEN ---
            function renderSubAreas() {
                showView('view-subareas');
                const view = document.getElementById('view-subareas');
                
                const groupsInArea = taskBank.filter(g => g.courses.includes(state.currentCourse) && g.area === state.currentArea);
                const subAreas = [...new Set(groupsInArea.map(g => g.subArea))].sort();
                
                view.innerHTML = '';
                view.appendChild(createBackButton(() => renderAreas()));
                
                const title = document.createElement('h2');
                title.className = 'text-xl font-bold mb-5 text-slate-300';
                title.innerText = `3. Välj delområde inom ${state.currentArea}`;
                view.appendChild(title);
                
                const container = document.createElement('div');
                container.className = 'space-y-3';
                
                container.appendChild(createButton(`Alla uppgifter på ${state.currentArea}`, () => selectSubArea('all'), 'bg-teal-700 hover:bg-teal-600'));
                
                subAreas.forEach(sub => {
                    container.appendChild(createButton(sub, () => selectSubArea(sub), 'bg-teal-600 hover:bg-teal-500'));
                });

                view.appendChild(container);
            }

            // --- VY: SVÅRIGHETSGRAD ---
            function renderDifficulty() {
                showView('view-difficulty');
                const view = document.getElementById('view-difficulty');
                
                let filteredGroups = taskBank.filter(g => g.courses.includes(state.currentCourse) && g.area === state.currentArea);
                if(state.currentSubArea !== 'all') {
                    filteredGroups = filteredGroups.filter(g => g.subArea === state.currentSubArea);
                }
                
                // Filtrera bort grupper som saknar difficulty eller versions
                const availableDifficulties = [...new Set(filteredGroups.filter(g => g.difficulty).map(g => g.difficulty))].sort();
                const subAreaText = state.currentSubArea === 'all' ? state.currentArea : state.currentSubArea;

                view.innerHTML = '';
                view.appendChild(createBackButton(() => renderSubAreas()));
                
                const title = document.createElement('h2');
                title.className = 'text-xl font-bold mb-5 text-slate-300';
                title.innerText = `4. Välj nivå för ${subAreaText}`;
                view.appendChild(title);
                
                const container = document.createElement('div');
                container.className = 'space-y-3';
                
                if(availableDifficulties.length === 0) {
                    container.innerHTML = '<p class="text-red-400">Inga uppgifter finns för detta urval. Saknas versions eller nivå i tasks.js?</p>';
                } else {
                    availableDifficulties.forEach(diff => {
                        const label = diff === 1 ? 'Nivå 1 (Grund)' : diff === 2 ? 'Nivå 2 (Medel)' : 'Nivå 3 (Svår)';
                        container.appendChild(createButton(label, () => selectDifficulty(diff), 'bg-amber-600 hover:bg-amber-500'));
                    });
                }

                view.appendChild(container);
            }

            // --- VY: UPPGIFT ---
            function renderTask() {
                showView('view-task');
                const view = document.getElementById('view-task');
                
                if(state.tasks.length === 0) {
                    view.innerHTML = '';
                    view.appendChild(createBackButton(() => renderDifficulty()));
                    const errorMsg = document.createElement('p');
                    errorMsg.className = 'text-center text-red-400 mt-10';
                    errorMsg.innerText = 'Det finns inga uppgifter för detta urval.';
                    view.appendChild(errorMsg);
                    return;
                }

                const task = state.tasks[state.currentTaskIndex];
                const taskNum = state.currentTaskIndex + 1;
                const totalTasks = state.tasks.length;

                // SVG Icon for calculator
                const calcIcon = `<svg class="w-5 h-5 mr-2 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z"></path></svg>`;

                view.innerHTML = `
                    <div class="flex justify-between items-center mb-6">
                        <button id="btn-leave-task" class="flex items-center gap-2 text-slate-400 hover:text-slate-200 transition-colors duration-200 group">
                            <svg class="w-4 h-4 transition-transform group-hover:-translate-x-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg> Avsluta
                        </button>
                        <span class="font-semibold text-sm text-slate-400 tracking-wider">UPPGIFT ${taskNum} / ${totalTasks}</span>
                    </div>
                    
                    <div class="bg-slate-800 p-6 rounded-xl shadow-lg mb-6 border border-slate-700/50">
                        <div id="task-question" class="math-question text-slate-100">
                            ${formatContent(task.question)}
                            ${task.img ? `<img src="${task.img}" alt="Uppgiftsbild" class="mt-4 rounded-lg border border-slate-700">` : ''}
                        </div>
                        ${task.calculator ? `<div class="mt-5 pt-4 border-t border-slate-700/50 text-sm text-slate-400 flex items-center">${calcIcon} Räknare tillåten</div>` : ''}
                    </div>

                    <div id="check-answer-container" class="mb-4">
                        <button onclick="showAnswer()" class="w-full p-3.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-semibold shadow-sm transition-all duration-200 hover:scale-[1.02]">
                            Kontrollera svar
                        </button>
                    </div>

                    <div id="answer-box" class="hidden bg-slate-800/60 p-5 rounded-xl border border-emerald-500/30 mb-4 shadow-inner">
                        <p class="font-semibold text-emerald-400 text-sm tracking-wider mb-2">FACIT</p>
                        <div id="task-answer" class="mt-1 text-emerald-300 math-question">
                            ${formatContent(task.solution)}
                        </div>
                        <div id="solution-btn-container" class="mt-5 border-t border-slate-700/50 pt-4">
                            <button onclick="showSolution()" class="w-full p-2.5 rounded-lg bg-emerald-900/30 hover:bg-emerald-900/50 text-emerald-300 font-medium transition text-sm border border-emerald-600/30">
                                Visa lösningsgång
                            </button>
                        </div>
                        <div id="solution-box" class="hidden mt-4 text-sm text-slate-400 italic">
                            Lösningsgången visas ovan i facit.
                        </div>
                    </div>

                    <button onclick="nextTask()" class="w-full p-3.5 rounded-xl bg-slate-700 hover:bg-slate-600 text-slate-200 font-semibold transition-all duration-200 border border-slate-600 hover:scale-[1.02]">
                        Nästa uppgift &rarr;
                    </button>
                `;

                document.getElementById('btn-leave-task').onclick = renderDifficulty;
                renderMath('task-question');
                renderMath('task-answer');
            }

            // --- LOGIKFUNKTIONER ---
            window.renderCourses = renderCourses;
            window.renderAreas = renderAreas;
            window.renderSubAreas = renderSubAreas;
            window.renderDifficulty = renderDifficulty;
            window.showAnswer = showAnswer;
            window.showSolution = showSolution;
            window.nextTask = nextTask;

            function selectCourse(course) {
                state.currentCourse = course;
                renderAreas();
            }

            function selectArea(area) {
                state.currentArea = area;
                renderSubAreas();
            }

            function selectSubArea(subArea) {
                state.currentSubArea = subArea;
                renderDifficulty();
            }

            function selectDifficulty(diff) {
                state.currentDifficulty = diff;
                
                let filteredGroups = taskBank.filter(g => 
                    g.courses.includes(state.currentCourse) && 
                    g.area === state.currentArea && 
                    g.difficulty === state.currentDifficulty
                );

                if(state.currentSubArea !== 'all') {
                    filteredGroups = filteredGroups.filter(g => g.subArea === state.currentSubArea);
                }

                // ROBUSTHET: Säkerställ att g.versions finns för att undvika krasch
                state.tasks = filteredGroups.flatMap(g => 
                    (g.versions || []).map(v => ({
                        ...v,
                        groupId: g.groupId,
                        calculator: g.calculator || false,
                        area: g.area,
                        subArea: g.subArea
                    }))
                );

                state.currentTaskIndex = 0;
                renderTask();
            }

            function showAnswer() {
                document.getElementById('check-answer-container').classList.add('hidden');
                document.getElementById('answer-box').classList.remove('hidden');
            }

            function showSolution() {
                document.getElementById('solution-btn-container').classList.add('hidden');
                document.getElementById('solution-box').classList.remove('hidden');
            }

            function nextTask() {
                if(state.currentTaskIndex < state.tasks.length - 1) {
                    state.currentTaskIndex++;
                    renderTask();
                } else {
                    const view = document.getElementById('view-task');
                    view.innerHTML = `
                        <div class="text-center mt-10 bg-slate-800 p-10 rounded-xl border border-slate-700/50 shadow-lg flex flex-col items-center">
                            <svg class="w-16 h-16 text-emerald-400 mb-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                            <h2 class="text-2xl font-bold text-slate-100 mb-3">Snygt jobbat!</h2>
                            <p class="mb-8 text-slate-400">Du har gjort alla uppgifter i detta område.</p>
                            <button onclick="renderDifficulty()" class="w-full max-w-xs p-3 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-semibold shadow-sm transition-all duration-200 hover:scale-[1.02]">
                                Välj ny nivå / område
                            </button>
                        </div>
                    `;
                }
            }

            renderCourses();
        }
    </script>
</body>
</html>
